<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voulez-Vous — Rotunda v2</title>
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#cfd3d6;font-family:sans-serif}
canvas{display:block}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#444;font-size:11px;letter-spacing:.25em;text-transform:uppercase;background:rgba(255,255,255,.5);padding:6px 14px;border-radius:20px;pointer-events:none}
#stick{position:fixed;left:26px;bottom:26px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(0,0,0,.18);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);touch-action:none;z-index:10}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.22)}
#xh{position:fixed;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:rgba(20,20,20,.4);box-shadow:0 0 0 4px rgba(255,255,255,.25);pointer-events:none;z-index:10}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag / arrows / WASD · joystick to walk</div>
<div id="stick"><div id="knob"></div></div>
<div id="xh"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.physicallyCorrectLights=true;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xdfe3e6,28,95);                 // soft daylight haze
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.1,400);
camera.position.set(0,2.0,19); // start on the entrance porch, facing into the dome (−Z)

/* ── First-person WALK controls: drag-look + WASD/arrows + on-screen joystick ── */
let yaw=0,pitch=-0.03;                        // start on +Z porch, facing into the dome (−Z)
const keys={},move={x:0,y:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
let drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;
  yaw-=(e.clientX-lx)*0.0028;pitch=Math.max(-0.5,Math.min(0.5,pitch-(e.clientY-ly)*0.0022));lx=e.clientX;ly=e.clientY;});
// on-screen joystick (matches the reference's bottom-left control)
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let sId=null,scx=0,scy=0;
stick.addEventListener('pointerdown',e=>{sId=e.pointerId;const r=stick.getBoundingClientRect();
  scx=r.left+r.width/2;scy=r.top+r.height/2;stick.setPointerCapture(e.pointerId);});
stick.addEventListener('pointermove',e=>{if(e.pointerId!==sId)return;
  let dx=e.clientX-scx,dy=e.clientY-scy;const m=Math.hypot(dx,dy),mx=44;if(m>mx){dx*=mx/m;dy*=mx/m;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;move.x=dx/mx;move.y=dy/mx;});
function stickEnd(e){if(e.pointerId!==sId)return;sId=null;move.x=move.y=0;knob.style.transform='';}
stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);
// walkable region = inside the dome OR the entrance porch corridor
function allowed(x,z){return (x*x+z*z<(R-1)*(R-1))||(Math.abs(x)<3.0&&z>0&&z<R+6);}

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

/* ── HDRI environment: sky background + PBR lighting ── */
const pmrem=new THREE.PMREMGenerator(renderer);pmrem.compileEquirectangularShader();
new THREE.RGBELoader().load('assets/3d/sky.hdr',hdr=>{
  const env=pmrem.fromEquirectangular(hdr).texture;
  scene.environment=env;
  scene.background=hdr;                       // equirect sky behind the arches
  hdr.mapping=THREE.EquirectangularReflectionMapping;
});

/* ── plaster PBR material ── */
const TL=new THREE.TextureLoader();
function plaster(rep=3){
  const d=TL.load('assets/3d/plaster_diff.jpg'),n=TL.load('assets/3d/plaster_nor.jpg'),r=TL.load('assets/3d/plaster_rough.jpg');
  [d,n,r].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);});
  d.encoding=THREE.sRGBEncoding;
  return new THREE.MeshStandardMaterial({map:d,normalMap:n,roughnessMap:r,roughness:1,metalness:0,color:0xeae7e0});
}
const wallMat=plaster(2);
const darkBase=new THREE.MeshStandardMaterial({color:0x20242a,roughness:.9,metalness:0});

/* ── DIMENSIONS ── */
const N=16;                 // bays (arches/piers)
const R=14;                 // radius to wall face
const WALL_H=9;             // arcade height
const step=Math.PI*2/N;

/* ── ARCHED COLONNADE ──
   Each bay is an extruded wall panel with an arched opening; the solid sides
   form the piers, the hole opens to the HDRI sky. */
function archPanel(w,h,depth){
  const ow=w*0.62, straight=h*0.44, ar=ow/2;        // opening width / straight height / arch radius — wider = more open
  const s=new THREE.Shape();
  s.moveTo(-w/2,0);s.lineTo(-w/2,h);s.lineTo(w/2,h);s.lineTo(w/2,0);s.lineTo(-w/2,0);
  const hole=new THREE.Path();
  hole.moveTo(-ow/2,0);hole.lineTo(-ow/2,straight);
  hole.absarc(0,straight,ar,Math.PI,0,true);
  hole.lineTo(ow/2,0);hole.lineTo(-ow/2,0);
  s.holes.push(hole);
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:24});
  g.translate(0,0,-depth/2);g.computeVertexNormals();
  return g;
}
const chord=2*R*Math.sin(step/2)+0.05;
const panelGeo=archPanel(chord,WALL_H,1.3);
for(let i=0;i<N;i++){
  const a=i*step;
  const m=new THREE.Mesh(panelGeo,wallMat);
  m.position.set(Math.sin(a)*R,0,Math.cos(a)*R);
  m.rotation.y=a+Math.PI;
  scene.add(m);
  // dark skirting strip along the base of each bay
  const sk=new THREE.Mesh(new THREE.BoxGeometry(chord,1.0,0.15),darkBase);
  sk.position.set(Math.sin(a)*(R-0.02),0.5,Math.cos(a)*(R-0.02));sk.rotation.y=a+Math.PI;scene.add(sk);
}

/* ── DRUM + GLASS RIBBED DOME ── */
const drumH=2.2;
const drum=new THREE.Mesh(new THREE.CylinderGeometry(R-0.2,R-0.2,drumH,N*3,1,true),wallMat);
drum.position.y=WALL_H+drumH/2;drum.material.side=THREE.DoubleSide;scene.add(drum);

const domeY=WALL_H+drumH;
const domeR=R-0.2;
// translucent glass shell
const glass=new THREE.Mesh(
  new THREE.SphereGeometry(domeR,48,28,0,Math.PI*2,0,Math.PI/2),
  new THREE.MeshStandardMaterial({roughness:.05,metalness:0,transparent:true,opacity:.14,color:0xffffff,envMapIntensity:1,side:THREE.DoubleSide,depthWrite:false}));
glass.position.y=domeY;glass.scale.y=0.72;scene.add(glass);
// iron rib lattice
const ribGeo=new THREE.SphereGeometry(domeR*1.002,24,10,0,Math.PI*2,0,Math.PI/2);
const ribs=new THREE.LineSegments(new THREE.WireframeGeometry(ribGeo),
  new THREE.LineBasicMaterial({color:0x3a3530}));
ribs.position.y=domeY;ribs.scale.y=0.72;scene.add(ribs);
// oculus ring
const oc=new THREE.Mesh(new THREE.TorusGeometry(domeR*0.16,0.12,8,32),new THREE.MeshStandardMaterial({color:0x2c2824,roughness:.5,metalness:.6}));
oc.rotation.x=Math.PI/2;oc.position.y=domeY+domeR*0.72-0.2;scene.add(oc);

/* ── TERRAZZO FLOOR (procedural PBR) ── */
function terrazzo(){
  const cv=document.createElement('canvas');cv.width=cv.height=1024;const x=cv.getContext('2d');
  x.fillStyle='#0c0d0f';x.fillRect(0,0,1024,1024);
  for(let i=0;i<2600;i++){
    const px=Math.random()*1024,py=Math.random()*1024,r=2+Math.random()*16;
    const g=Math.random();x.fillStyle=g<.6?'#cdc7bd':g<.85?'#7d7c79':'#2b2c2e';
    x.beginPath();const n=5+(i%4);
    for(let k=0;k<n;k++){const a=k/n*Math.PI*2,rr=r*(0.7+Math.random()*0.5);
      x.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr);}
    x.closePath();x.fill();
  }
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(5,5);t.encoding=THREE.sRGBEncoding;return t;
}
const floor=new THREE.Mesh(new THREE.CircleGeometry(R+2,72),
  new THREE.MeshStandardMaterial({map:terrazzo(),roughness:.35,metalness:.0,envMapIntensity:.6}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
// blue runner rugs radiating out
const rug=new THREE.MeshStandardMaterial({color:0x21366b,roughness:.95});
for(let i=0;i<N;i++){const a=i*step;
  const r=new THREE.Mesh(new THREE.PlaneGeometry(2.4,R-2),rug);
  r.rotation.x=-Math.PI/2;r.rotation.z=-a;
  r.position.set(Math.sin(a)*(R/2),0.01,Math.cos(a)*(R/2));scene.add(r);
}

/* ── CENTRE: stepped podium + urn + spheres ── */
const stone=new THREE.MeshStandardMaterial({color:0xd9cdb4,roughness:.8});
const podium=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.8,0.5,40),stone);podium.position.y=0.25;scene.add(podium);
// urn via lathe
const pts=[];for(let i=0;i<=12;i++){const t=i/12;pts.push(new THREE.Vector2(Math.sin(t*Math.PI*0.95)*0.9+0.15,t*2.4));}
const urn=new THREE.Mesh(new THREE.LatheGeometry(pts,40),new THREE.MeshStandardMaterial({color:0x1e3b39,roughness:.4,metalness:.2}));
urn.position.y=0.5;scene.add(urn);
const sphMat=new THREE.MeshStandardMaterial({color:0xf2efe9,roughness:.6});
for(let i=0;i<3;i++){const a=i/3*Math.PI*2;const s=new THREE.Mesh(new THREE.SphereGeometry(0.42,24,24),sphMat);
  s.position.set(Math.sin(a)*1.7,0.92,Math.cos(a)*1.7);scene.add(s);}

/* ── CHANDELIER (iron) ── */
const ironM=new THREE.MeshStandardMaterial({color:0x2a2622,roughness:.5,metalness:.7});
const chand=new THREE.Group();
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,0.05,8,40),ironM);ring.rotation.x=Math.PI/2;chand.add(ring);
const ring2=new THREE.Mesh(new THREE.TorusGeometry(0.8,0.04,8,32),ironM);ring2.rotation.x=Math.PI/2;ring2.position.y=0.5;chand.add(ring2);
for(let i=0;i<10;i++){const a=i/10*Math.PI*2;
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,12),new THREE.MeshStandardMaterial({color:0xfff2cc,emissive:0xffcc66,emissiveIntensity:1.2}));
  b.position.set(Math.cos(a)*1.3,0.05,Math.sin(a)*1.3);chand.add(b);}
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,3,8),ironM);rod.position.y=1.6;chand.add(rod);
chand.position.set(0,WALL_H+1.2,0);scene.add(chand);
const chLight=new THREE.PointLight(0xffe6b0,40,40,2);chLight.position.set(0,WALL_H,0);scene.add(chLight);

/* ── art frames on the piers (placeholder until commerce port) ── */
const frameMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6});
for(let i=0;i<N;i++){const a=(i+0.5)*step;
  const fx=Math.sin(a)*(R-0.7), fz=Math.cos(a)*(R-0.7);
  const f=new THREE.Mesh(new THREE.BoxGeometry(1.9,2.3,0.08),frameMat);
  f.position.set(fx,3.0,fz);f.rotation.y=a+Math.PI;scene.add(f);
  const c=new THREE.Mesh(new THREE.PlaneGeometry(1.6,2.0),new THREE.MeshBasicMaterial({color:0xe9e9ea,toneMapped:false}));
  c.position.set(Math.sin(a)*(R-0.74),3.0,Math.cos(a)*(R-0.74));c.rotation.y=a+Math.PI;scene.add(c);
}

/* ── ENTRANCE PORCH + BRANDING EASEL (you start here; the dome is ahead) ── */
function brandBoardTex(){
  const cv=document.createElement('canvas');cv.width=512;cv.height=652;const x=cv.getContext('2d');
  x.fillStyle='#fbf9f4';x.fillRect(0,0,512,652);
  x.strokeStyle='#1a1a1a';x.lineWidth=3;x.strokeRect(22,22,468,608);
  x.strokeStyle='#111';x.lineWidth=26;x.lineJoin='miter';x.lineCap='butt';
  const cx=256,top=120,bot=300,V=ox=>{x.beginPath();x.moveTo(cx-95+ox,top);x.lineTo(cx-30+ox,bot);x.lineTo(cx+35+ox,top);x.stroke();};
  V(-36);V(36);
  x.fillStyle='#111';x.textAlign='center';
  x.font='300 56px Georgia';x.fillText('Voulez-Vous',cx,402);
  x.font='600 23px Arial';x.fillText('B O R N   T O   W I N',cx,442);
  x.strokeStyle='#b08d3c';x.lineWidth=1.5;x.beginPath();x.moveTo(150,492);x.lineTo(362,492);x.stroke();
  x.fillStyle='#b08d3c';x.font='600 22px Arial';x.fillText('STEP INTO THE GALLERY',cx,560);
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;
}
function buildEasel(){
  const g=new THREE.Group();
  const wood=new THREE.MeshStandardMaterial({color:0x5a4632,roughness:.7});
  const board=new THREE.Mesh(new THREE.BoxGeometry(1.55,2.0,0.07),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5}));
  board.position.set(0,2.0,0);board.rotation.x=-0.07;g.add(board);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(1.42,1.85),new THREE.MeshBasicMaterial({map:brandBoardTex(),toneMapped:false}));
  face.position.set(0,2.0,0.04);face.rotation.x=-0.07;g.add(face);
  const legGeo=new THREE.CylinderGeometry(0.045,0.045,3.0,8);
  const l1=new THREE.Mesh(legGeo,wood);l1.position.set(-0.62,1.3,0.1);l1.rotation.z=0.11;g.add(l1);
  const l2=new THREE.Mesh(legGeo,wood);l2.position.set(0.62,1.3,0.1);l2.rotation.z=-0.11;g.add(l2);
  const l3=new THREE.Mesh(legGeo,wood);l3.position.set(0,1.3,-0.55);l3.rotation.x=0.28;g.add(l3);
  const cb=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.07,0.07),wood);cb.position.set(0,1.0,0.12);g.add(cb);
  return g;
}
// porch floor + low side walls extending out from the +Z entrance bay
const porch=new THREE.Mesh(new THREE.BoxGeometry(6,0.4,8),stone);porch.position.set(0,-0.2,R+2.5);scene.add(porch);
[-3,3].forEach(sx=>{const w=new THREE.Mesh(new THREE.BoxGeometry(0.45,2.4,8),wallMat);w.position.set(sx,1.2,R+2.5);scene.add(w);});
// blue runner leading in
const inRug=new THREE.Mesh(new THREE.PlaneGeometry(2.2,9),rug);inRug.rotation.x=-Math.PI/2;inRug.position.set(0,0.02,R+2.5);scene.add(inRug);
// branding easel at the porch mouth
const easel=buildEasel();easel.position.set(1.7,0,R+3.0);easel.rotation.y=0.3;scene.add(easel); // faces the entering visitor

/* fill light */
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8d90,0.4));

const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05), spd=4.6;
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const rgt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  let mf=0,mr=0;
  if(keys['w']||keys['arrowup'])mf+=1;
  if(keys['s']||keys['arrowdown'])mf-=1;
  if(keys['a']||keys['arrowleft'])mr-=1;
  if(keys['d']||keys['arrowright'])mr+=1;
  mf-=move.y; mr+=move.x;                       // joystick (push up = forward)
  const px=camera.position.x, pz=camera.position.z;
  camera.position.addScaledVector(fwd,mf*spd*dt);
  camera.position.addScaledVector(rgt,mr*spd*dt);
  if(!allowed(camera.position.x,camera.position.z)){camera.position.x=px;camera.position.z=pz;}
  camera.position.y=2.0+Math.sin(clock.elapsedTime*1.3)*0.02;
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
  renderer.render(scene,camera);
}
loop();
</script>
</body></html>
