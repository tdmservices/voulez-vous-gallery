<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voulez-Vous — Rotunda v2</title>
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#cfd3d6;font-family:sans-serif}
canvas{display:block}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#444;font-size:11px;letter-spacing:.25em;text-transform:uppercase;background:rgba(255,255,255,.5);padding:6px 14px;border-radius:20px;pointer-events:none}
#stick{position:fixed;left:26px;bottom:26px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(0,0,0,.18);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);touch-action:none;z-index:10}
#knob,#knobR{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.22)}
#stickR{position:fixed;right:26px;bottom:26px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(0,0,0,.18);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);touch-action:none;z-index:10}
#xh{position:fixed;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:rgba(20,20,20,.4);box-shadow:0 0 0 4px rgba(255,255,255,.25);pointer-events:none;z-index:10}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hint">left stick / WASD · walk &nbsp;·&nbsp; right stick / drag · look</div>
<div id="stick"><div id="knob"></div></div>
<div id="stickR"><div id="knobR"></div></div>
<div id="xh"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/3d/RGBELoader.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.physicallyCorrectLights=true;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd2d7da);   // fallback sky → never a black screen
scene.fog=new THREE.Fog(0xc4ccd2,140,650); // light far haze only — keeps the sea/clouds/mountains visible
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.1,500);

/* ── DIMENSIONS: two concentric rings ── */
const R_OUT=16, R_IN=9;       // outer hall radius, inner rotunda radius
const H=7, DRUM=2;            // wall height, drum height
const N_OUT=14, N_IN=16;      // outer arches (open to sea), inner bays (PRODUCTS)
const stepO=Math.PI*2/N_OUT, stepI=Math.PI*2/N_IN;
camera.position.set(0,2.0,R_OUT-2.5); // start just inside the entrance arch, facing in (−Z)

/* ── WALK controls: drag-look + WASD/arrows + joystick ── */
let yaw=0,pitch=-0.02;
const keys={},move={x:0,y:0},look={x:0,y:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
let drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*0.0028;pitch=Math.max(-0.5,Math.min(0.5,pitch-(e.clientY-ly)*0.0022));lx=e.clientX;ly=e.clientY;});
function makeStick(el,knob,t){
  let id=null,cx=0,cy=0;
  const reset=()=>{id=null;t.x=0;t.y=0;knob.style.transform='';};
  el.addEventListener('pointerdown',e=>{id=e.pointerId;const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;try{el.setPointerCapture(id);}catch(_){}});
  el.addEventListener('pointermove',e=>{if(id===null)return;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),mx=44;if(m>mx){dx*=mx/m;dy*=mx/m;}knob.style.transform=`translate(${dx}px,${dy}px)`;t.x=dx/mx;t.y=dy/mx;});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,reset));  // never sticks
  return reset;
}
const resetMove=makeStick(document.getElementById('stick'),document.getElementById('knob'),move);   // left = walk
const resetLook=makeStick(document.getElementById('stickR'),document.getElementById('knobR'),look); // right = look
addEventListener('blur',()=>{resetMove();resetLook();});
// walkable: inside the outer wall, not into the central podium, plus the entrance porch
function allowed(x,z){const r=Math.hypot(x,z);return r<R_OUT-0.8&&r>1.5;}

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

/* ── HDRI sea environment (guarded — gallery still renders if it fails) ── */
if(window.THREE&&THREE.RGBELoader){
  try{
    const pmrem=new THREE.PMREMGenerator(renderer);pmrem.compileEquirectangularShader();
    new THREE.RGBELoader().load('assets/3d/sky.hdr',hdr=>{
      try{scene.environment=pmrem.fromEquirectangular(hdr).texture;
        hdr.mapping=THREE.EquirectangularReflectionMapping;scene.background=hdr;}catch(e){console.warn('[VV] env',e);}
    },undefined,()=>console.warn('[VV] sky.hdr failed to load'));
  }catch(e){console.warn('[VV] RGBELoader unavailable',e);}
}else{console.warn('[VV] RGBELoader missing — using fallback sky');}

/* ── materials ── */
const TL=new THREE.TextureLoader();
function plaster(rep){
  const d=TL.load('assets/3d/plaster_diff.jpg'),n=TL.load('assets/3d/plaster_nor.jpg'),r=TL.load('assets/3d/plaster_rough.jpg');
  [d,n,r].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);});d.encoding=THREE.sRGBEncoding;
  return new THREE.MeshStandardMaterial({map:d,normalMap:n,roughnessMap:r,roughness:1,metalness:0,color:0xeae7e0});
}
const wallMat=plaster(2), wallMat2=plaster(1.4);
const darkBase=new THREE.MeshStandardMaterial({color:0x1c1f26,roughness:.95});
const stone=new THREE.MeshStandardMaterial({color:0xd9cdb4,roughness:.85});

/* ── arched wall panel (solid sides = piers, hole = arch open to beyond) ── */
function archPanel(w,h,depth,openF){
  const ow=w*(openF||0.6), straight=h*0.44, ar=ow/2;
  const s=new THREE.Shape();
  s.moveTo(-w/2,0);s.lineTo(-w/2,h);s.lineTo(w/2,h);s.lineTo(w/2,0);s.lineTo(-w/2,0);
  const hole=new THREE.Path();
  hole.moveTo(-ow/2,0);hole.lineTo(-ow/2,straight);hole.absarc(0,straight,ar,Math.PI,0,true);hole.lineTo(ow/2,0);hole.lineTo(-ow/2,0);
  s.holes.push(hole);
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:24});
  g.translate(0,0,-depth/2);g.computeVertexNormals();return g;
}
/* OUTER ring — product hall wall, arches open to the SEA */
const chordO=2*R_OUT*Math.sin(stepO/2)+0.05;
const panelO=archPanel(chordO,H,1.3,0.6);
for(let i=0;i<N_OUT;i++){const a=i*stepO;
  const m=new THREE.Mesh(panelO,wallMat);m.position.set(Math.sin(a)*R_OUT,0,Math.cos(a)*R_OUT);m.rotation.y=a+Math.PI;scene.add(m);
  const sk=new THREE.Mesh(new THREE.BoxGeometry(chordO*0.96,0.85,0.08),darkBase);
  sk.position.set(Math.sin(a)*(R_OUT-0.72),0.42,Math.cos(a)*(R_OUT-0.72));sk.rotation.y=a+Math.PI;scene.add(sk);
}
/* INNER ring — smaller arcade that carries the dome */
const chordI=2*R_IN*Math.sin(stepI/2)+0.05;
const panelI=archPanel(chordI,H,1.0,0.62);
for(let i=0;i<N_IN;i++){const a=i*stepI;
  const m=new THREE.Mesh(panelI,wallMat2);m.position.set(Math.sin(a)*R_IN,0,Math.cos(a)*R_IN);m.rotation.y=a+Math.PI;scene.add(m);
}
/* AMBULATORY ROOF — flat ring over the aisle (between the two rings) */
const roof=new THREE.Mesh(new THREE.RingGeometry(R_IN-0.2,R_OUT+0.1,64),new THREE.MeshStandardMaterial({color:0xe7e3da,roughness:1,side:THREE.DoubleSide}));
roof.rotation.x=-Math.PI/2;roof.position.y=H;scene.add(roof);

/* ── DRUM + GLASS RIBBED DOME (on the INNER ring) ── */
const drum=new THREE.Mesh(new THREE.CylinderGeometry(R_IN-0.1,R_IN-0.1,DRUM,N_IN*3,1,true),wallMat2);
drum.position.y=H+DRUM/2;drum.material.side=THREE.DoubleSide;scene.add(drum);
const domeY=H+DRUM, domeR=R_IN-0.1;
const glass=new THREE.Mesh(new THREE.SphereGeometry(domeR,40,24,0,Math.PI*2,0,Math.PI/2),
  new THREE.MeshStandardMaterial({roughness:.05,metalness:0,transparent:true,opacity:.14,color:0xffffff,envMapIntensity:1,side:THREE.DoubleSide,depthWrite:false}));
glass.position.y=domeY;glass.scale.y=0.72;scene.add(glass);
const ribs=new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(domeR*1.003,22,9,0,Math.PI*2,0,Math.PI/2)),new THREE.LineBasicMaterial({color:0x3a3530}));
ribs.position.y=domeY;ribs.scale.y=0.72;scene.add(ribs);

/* ── GRAND CRYSTAL CHANDELIER (Empire / crystal-basket style) ── */
const brass=new THREE.MeshStandardMaterial({color:0x5e4a22,roughness:.38,metalness:.95,envMapIntensity:1.1}); // dark antique bronze → reads against the white dome
const crystal=new THREE.MeshStandardMaterial({color:0xc9dcf0,roughness:.05,metalness:.1,envMapIntensity:1.6,transparent:true,opacity:.88});
const candleM=new THREE.MeshStandardMaterial({color:0xb7d2ea,roughness:.4});           // pale-blue candles
const flameM=new THREE.MeshStandardMaterial({color:0xfff4d6,emissive:0xffcf78,emissiveIntensity:2.4});
const chand=new THREE.Group();
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,3,8),brass);rod.position.y=2.2;chand.add(rod);
const crown=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.42,0.55,12),brass);crown.position.y=0.95;chand.add(crown);
const Rring=1.75;
const mainRing=new THREE.Mesh(new THREE.TorusGeometry(Rring,0.06,10,64),brass);mainRing.rotation.x=Math.PI/2;mainRing.position.y=0.32;chand.add(mainRing);
const NA=18;
for(let i=0;i<NA;i++){const a=i/NA*Math.PI*2,cx=Math.cos(a),cz=Math.sin(a);
  const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.05,0.12,8),brass);cup.position.set(cx*Rring,0.43,cz*Rring);chand.add(cup);
  const candle=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.22,8),candleM);candle.position.set(cx*Rring,0.58,cz*Rring);chand.add(candle);
  const flame=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),flameM);flame.position.set(cx*Rring,0.75,cz*Rring);chand.add(flame);
}
// crystal basket — rings of faceted beads tapering down to a point
const tiers=9;
for(let t=0;t<tiers;t++){const f=t/(tiers-1),r=Rring*(1-f*0.93),y=0.22-f*1.85,beads=Math.max(6,Math.round(r*15));
  for(let i=0;i<beads;i++){const a=(i+ (t%2)*0.5)/beads*Math.PI*2;
    const b=new THREE.Mesh(new THREE.OctahedronGeometry(0.07,0),crystal);b.position.set(Math.cos(a)*r,y,Math.sin(a)*r);b.rotation.y=a;chand.add(b);}
}
const drop=new THREE.Mesh(new THREE.OctahedronGeometry(0.18,0),crystal);drop.position.y=-1.75;chand.add(drop);
// upper crystal tier
const upRing=new THREE.Mesh(new THREE.TorusGeometry(1.05,0.045,8,48),brass);upRing.rotation.x=Math.PI/2;upRing.position.y=0.66;chand.add(upRing);
for(let i=0;i<14;i++){const a=i/14*Math.PI*2;const b=new THREE.Mesh(new THREE.OctahedronGeometry(0.06,0),crystal);b.position.set(Math.cos(a)*1.05,0.74,Math.sin(a)*1.05);chand.add(b);}
chand.scale.setScalar(1.85);chand.position.set(0,H+1.7,0);scene.add(chand); // bigger, hung lower into the room
const chLight=new THREE.PointLight(0xffe6b0,60,55,2);chLight.position.set(0,H+1,0);scene.add(chLight);

/* ── FLOOR: one flush disc — terrazzo centre + navy carpet aisle + blue runners ── */
function floorTex(){
  const cv=document.createElement('canvas');cv.width=cv.height=1024;const x=cv.getContext('2d'),C=512;
  const px=r=>r/R_OUT*C;
  // terrazzo base everywhere
  x.fillStyle='#0c0d0f';x.fillRect(0,0,1024,1024);
  for(let i=0;i<3000;i++){const ang=Math.random()*6.28,rr=Math.sqrt(Math.random())*C,pxp=C+Math.cos(ang)*rr,pyp=C+Math.sin(ang)*rr,r=2+Math.random()*15;
    const g=Math.random();x.fillStyle=g<.6?'#cdc7bd':g<.85?'#7d7c79':'#2b2c2e';x.beginPath();const n=5+(i%4);
    for(let k=0;k<n;k++){const aa=k/n*6.28,rad=r*(0.7+Math.random()*0.5);x.lineTo(pxp+Math.cos(aa)*rad,pyp+Math.sin(aa)*rad);}x.closePath();x.fill();}
  // navy carpet ring (aisle) = donut between R_IN and R_OUT
  x.fillStyle='#16223f';x.beginPath();x.arc(C,C,px(R_OUT),0,6.28,false);x.arc(C,C,px(R_IN),0,6.28,true);x.fill();
  // lighter-blue radial runners aligned to outer bays
  for(let i=0;i<N_OUT;i++){const a=(i+0.5)*stepO;x.save();x.translate(C,C);x.rotate(-a);x.fillStyle='#2c4685';
    x.fillRect(-px(0.7),px(R_IN+0.2),px(1.4),px(R_OUT-R_IN-0.6));x.restore();}
  // gold thresholds rings
  x.strokeStyle='#b89a52';x.lineWidth=4;[R_IN,R_OUT-0.3].forEach(r=>{x.beginPath();x.arc(C,C,px(r),0,6.28);x.stroke();});
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;
}
// SEA — large reflective water plane to the horizon (set well below the floor → no flicker)
const sea=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:0x33576f,roughness:.22,metalness:0,envMapIntensity:1.3}));
sea.rotation.x=-Math.PI/2;sea.position.y=-0.12;scene.add(sea); // near floor level → sea meets the arches, no grey cliff
// rotunda floor (raised above the sea + polygonOffset → kills z-fighting/flicker)
const floor=new THREE.Mesh(new THREE.CircleGeometry(R_OUT,96),new THREE.MeshStandardMaterial({map:floorTex(),roughness:.5,metalness:0,envMapIntensity:.4,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));
floor.rotation.x=-Math.PI/2;floor.position.y=0;scene.add(floor);
// thin base ring so the floor doesn't look like it floats over the sea

/* ── CENTRE: stepped podium + urn + spheres (inside the inner ring) ── */
const podium=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.7,0.5,40),stone);podium.position.y=0.25;scene.add(podium);
const pts=[];for(let i=0;i<=14;i++){const t=i/14;pts.push(new THREE.Vector2(Math.sin(t*Math.PI*0.92)*0.78*(1-t*0.15)+0.12,t*2.5));}
const urn=new THREE.Mesh(new THREE.LatheGeometry(pts,40),new THREE.MeshStandardMaterial({color:0x1e3b39,roughness:.4,metalness:.25}));urn.position.y=0.5;scene.add(urn);
const sphMat=new THREE.MeshStandardMaterial({color:0xf2efe9,roughness:.6});
for(let i=0;i<3;i++){const a=i/3*Math.PI*2;const s=new THREE.Mesh(new THREE.SphereGeometry(0.4,24,24),sphMat);s.position.set(Math.sin(a)*1.6,0.9,Math.cos(a)*1.6);scene.add(s);}

/* ── PRODUCT DISPLAY: white frames on the INNER rotunda piers, facing OUT to the aisle ── */
const frameMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.55});
const artCanvases=[];
for(let i=0;i<N_IN;i++){const a=(i+0.5)*stepI, fr=R_IN-0.56;   // INNER face — facing the centre, seen from inside the dome
  const f=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,0.09),frameMat);f.position.set(Math.sin(a)*fr,2.9,Math.cos(a)*fr);f.rotation.y=a+Math.PI;scene.add(f);
  const c=new THREE.Mesh(new THREE.PlaneGeometry(1.32,1.32),new THREE.MeshBasicMaterial({color:0xf2f2f0,toneMapped:false}));
  c.position.set(Math.sin(a)*(fr-0.05),2.9,Math.cos(a)*(fr-0.05));c.rotation.y=a+Math.PI;scene.add(c);artCanvases.push(c);
}
/* live Shopify product images */
const SHOP={domain:'voulezvous-9945.myshopify.com',token:'6e0cf7b855cc8f3a88706494a6adfc93',ver:'2024-07'};
(async()=>{try{
  const res=await fetch(`https://${SHOP.domain}/api/${SHOP.ver}/graphql.json`,{method:'POST',headers:{'Content-Type':'application/json','X-Shopify-Storefront-Access-Token':SHOP.token},body:JSON.stringify({query:'{products(first:30){nodes{title featuredImage{url}}}}'})});
  const prods=((await res.json()).data.products.nodes)||[];const tl=new THREE.TextureLoader();tl.setCrossOrigin('anonymous');
  prods.forEach((p,i)=>{const cv=artCanvases[i];if(!cv||!p.featuredImage)return;tl.load(p.featuredImage.url,t=>{t.encoding=THREE.sRGBEncoding;cv.material=new THREE.MeshBasicMaterial({map:t,toneMapped:false});});});
}catch(e){console.warn('[VV] products',e);}})();

/* ── ENTRANCE: porch + VV branding easel (one outer bay = the doorway, +Z) ── */
function brandTex(){
  const cv=document.createElement('canvas');cv.width=512;cv.height=652;const x=cv.getContext('2d');
  x.fillStyle='#fbf9f4';x.fillRect(0,0,512,652);x.strokeStyle='#1a1a1a';x.lineWidth=3;x.strokeRect(22,22,468,608);
  x.strokeStyle='#111';x.lineWidth=26;const cx=256,V=ox=>{x.beginPath();x.moveTo(cx-95+ox,120);x.lineTo(cx-30+ox,300);x.lineTo(cx+35+ox,120);x.stroke();};V(-36);V(36);
  x.fillStyle='#111';x.textAlign='center';x.font='300 56px Georgia';x.fillText('Voulez-Vous',cx,402);
  x.font='600 23px Arial';x.fillText('B O R N   T O   W I N',cx,442);
  x.fillStyle='#b08d3c';x.font='600 22px Arial';x.fillText('STEP INTO THE GALLERY',cx,560);
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;
}
(function easel(){const g=new THREE.Group();const wood=new THREE.MeshStandardMaterial({color:0x5a4632,roughness:.7});
  const board=new THREE.Mesh(new THREE.BoxGeometry(1.55,2.0,0.07),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5}));board.position.set(0,2.0,0);board.rotation.x=-0.07;g.add(board);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(1.42,1.85),new THREE.MeshBasicMaterial({map:brandTex(),toneMapped:false}));face.position.set(0,2.0,0.04);face.rotation.x=-0.07;g.add(face);
  const lg=new THREE.CylinderGeometry(0.045,0.045,3.0,8);
  [[-0.62,0.11,0],[0.62,-0.11,0]].forEach(([x,rz])=>{const l=new THREE.Mesh(lg,wood);l.position.set(x,1.3,0.1);l.rotation.z=rz;g.add(l);});
  const l3=new THREE.Mesh(lg,wood);l3.position.set(0,1.3,-0.55);l3.rotation.x=0.28;g.add(l3);
  g.position.set(2.7,0,R_OUT-3.2);g.rotation.y=0.5;scene.add(g);})(); // branding easel just inside the entrance (no porch → no grey band)

scene.add(new THREE.HemisphereLight(0xffffff,0x9a958c,0.6));
const sun=new THREE.DirectionalLight(0xfff4e2,2.0);sun.position.set(18,28,12);scene.add(sun); // guarantees lit geometry even if the HDRI env fails

/* ── render loop ── */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),spd=4.6;
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),rgt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  let mf=0,mr=0;
  if(keys['w']||keys['arrowup'])mf+=1;if(keys['s']||keys['arrowdown'])mf-=1;
  if(keys['a']||keys['arrowleft'])mr-=1;if(keys['d']||keys['arrowright'])mr+=1;
  mf-=move.y;mr+=move.x;
  const px=camera.position.x,pz=camera.position.z;
  camera.position.addScaledVector(fwd,mf*spd*dt);camera.position.addScaledVector(rgt,mr*spd*dt);
  if(!allowed(camera.position.x,camera.position.z)){camera.position.x=px;camera.position.z=pz;}
  camera.position.y=2.0+Math.sin(clock.elapsedTime*1.3)*0.02;
  // right joystick → look around
  if(look.x||look.y){yaw-=look.x*1.7*dt;pitch=Math.max(-0.5,Math.min(0.5,pitch-look.y*1.3*dt));}
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
  renderer.render(scene,camera);
}
loop();
</script>
</body></html>
